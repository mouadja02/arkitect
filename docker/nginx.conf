# The image's own server block, served under a Content-Security-Policy (#348).
# The app is excalidraw.com's, unchanged: Share, Live collaboration and its AI
# tools post to Excalidraw's servers, and it fetches fonts from esm.sh on load.
# connect-src 'self' makes the browser refuse every one of those requests; the
# fonts it needs are in the image under /fonts.
server {
    listen       80;
    server_name  localhost;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
