name: draw.io desktop

# Proves the built icon libraries survive the real application: every library
# loaded the way Draw.io parses one, and every committed mark - the GCP marks
# with masks and filters among them - exported to PNG by Draw.io Desktop, with
# ink measured in each mark's own tile (#12, #13, #33).
#
# Desktop is a 120 MB install, so this runs only when something that could break
# a library changes. The main suite in ci.yml stays offline and dependency-free.

on:
  push:
    branches: [main]
    paths:
      - 'skills/arkitect-drawio/**'
      - 'tests/drawio.mjs'
      - '.github/workflows/drawio-desktop.yml'
  pull_request:
    paths:
      - 'skills/arkitect-drawio/**'
      - 'tests/drawio.mjs'
      - '.github/workflows/drawio-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Draw.io Desktop export · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The .deb is installed with apt, and Xvfb drives a real Electron app:
      # the two things most likely to move between images. 26 is proven here
      # before `ubuntu-latest` migrates to it (#122).
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    env:
      DRAWIO_VERSION: 31.4.5
      # GitHub's published digest for drawio-amd64-31.4.5.deb. Bump both together.
      DRAWIO_SHA256: 296729ee18f781dc82deb757de2b3399fbe04fe0ddad3093909013e707ee2ae4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache the Desktop package
        uses: actions/cache@v6
        with:
          path: ~/.cache/drawio-desktop
          key: drawio-desktop-${{ matrix.os }}-${{ env.DRAWIO_VERSION }}-amd64

      - name: Install Draw.io Desktop (pinned, checksum verified)
        run: |
          mkdir -p ~/.cache/drawio-desktop
          deb="$HOME/.cache/drawio-desktop/drawio-amd64-$DRAWIO_VERSION.deb"
          if [ ! -f "$deb" ]; then
            curl -fsSL -o "$deb" \
              "https://github.com/jgraph/drawio-desktop/releases/download/v$DRAWIO_VERSION/drawio-amd64-$DRAWIO_VERSION.deb"
          fi
          echo "$DRAWIO_SHA256  $deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb "$deb"

      # "required": a missing or unlaunchable Desktop fails the job rather than
      # skipping, so a broken install can never pass as green.
      - name: Strict library load and Desktop export
        env:
          ARKITECT_DRAWIO_SMOKE: required
        run: node tests/drawio.mjs
