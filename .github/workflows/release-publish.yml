name: release publish

# Runs when a release/vX.Y.Z pull request from release-prepare.yml is merged,
# and only then (#88). Tags the merge commit and publishes a GitHub Release whose
# body is that version's CHANGELOG.md section, verbatim. Then the same version
# goes to npm with provenance, when an NPM_TOKEN secret is set (#126).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write   # npm provenance

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # The branch name and the manifests must agree, or nothing is tagged.
      - name: Version from the branch, checked against the merge commit
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${HEAD_REF#release/v}"
          node scripts/release.mjs check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Tagging and publishing are two calls, and the second can fail after the
      # first has succeeded. A rerun used to trip over the tag it pushed itself,
      # so observe first, then act on the answer (#120). A tag that points
      # anywhere but this merge commit is never moved.
      - name: What is already published
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          peeled=$(git ls-remote origin "refs/tags/v$VERSION^{}" | awk '{print $1}')
          plain=$(git ls-remote origin "refs/tags/v$VERSION" | awk '{print $1}')
          tag_sha="${peeled:-$plain}"
          release=false
          if gh release view "v$VERSION" --json tagName >/dev/null 2>&1; then release=true; fi
          node scripts/release.mjs resume-publish --version "$VERSION" --tag-sha "$tag_sha" \
            --head-sha "$SHA" --release "$release" | tee -a "$GITHUB_OUTPUT"

      - name: Stop on a state a person has to settle
        if: steps.resume.outputs.action == 'conflict'
        run: |
          echo "::error::${{ steps.resume.outputs.reason }}"
          exit 1

      - name: Already published
        if: steps.resume.outputs.action == 'noop'
        run: echo "::notice::${{ steps.resume.outputs.reason }}"

      - name: Tag the merge commit
        if: steps.resume.outputs.action == 'tag-and-release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Arkitect $VERSION" "$SHA"
          git push origin "v$VERSION"

      - name: Publish the release
        if: steps.resume.outputs.action == 'tag-and-release' || steps.resume.outputs.action == 'release-only'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release.mjs notes "$VERSION" > notes.md
          gh release create "v$VERSION" --title "Arkitect $VERSION" --notes-file notes.md --verify-tag

      # After the tag and the Release, never before: a version on npm can't be
      # reused, and can't be unpublished after 72 hours. Without the secret the
      # release stands and this says so. A rerun finds the version already
      # there and publishes nothing (#126).
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set: v$VERSION is tagged and on GitHub, not on npm"
            exit 0
          fi
          if [ "$(npm view "arkitect@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::arkitect@$VERSION is already on npm"
            exit 0
          fi
          npm publish --provenance --access public
