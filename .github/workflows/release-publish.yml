name: release publish

# Runs when a release/vX.Y.Z pull request from release-prepare.yml is merged,
# and only then (#88). Tags the merge commit and publishes a GitHub Release whose
# body is that version's CHANGELOG.md section, verbatim. No npm publish.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The branch name and the manifests must agree, or nothing is tagged.
      - name: Version from the branch, checked against the merge commit
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${HEAD_REF#release/v}"
          node scripts/release.mjs check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          node scripts/release.mjs notes "$VERSION" > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Arkitect $VERSION" "$SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "Arkitect $VERSION" --notes-file notes.md --verify-tag
