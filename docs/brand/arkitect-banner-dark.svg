<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="Arkitect — your agent draws the architecture">
  <title>Arkitect</title>
  <!--
    One form, two hands. The node on the left is ruled; the node on the right is
    drawn freehand. One connector runs between them, ruled until it crosses the
    seam and wobbling after it: that crossing is where the product changes
    engine. The geometry is the product's own - 78px nodes, square corners
    (rounded: 0), 90 degrees only. Monochrome, on a transparent ground, so it
    sits on a light or a dark page. This is the dark-theme ink: identical
    geometry, one colour swapped, and a test holds the two files identical
    apart from the palette. See docs/brand.md.
  -->
  <g fill="none" stroke="#e6edf3">

    <!-- the wordmark, and the rule the tagline hangs from -->
    <g stroke="none" fill="#e6edf3" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif">
      <text x="80" y="132" font-size="105" font-weight="700" letter-spacing="-2"
            textLength="470" lengthAdjust="spacingAndGlyphs">Arkitect</text>
      <text x="80" y="200" font-size="26" font-weight="400"
            textLength="432" lengthAdjust="spacingAndGlyphs">Your agent draws the architecture.</text>
    </g>
    <path d="M80 168 H600" stroke-width="2"/>

    <!-- ruled: a Draw.io node, and the connector leaving it at a right angle -->
    <rect x="760" y="52" width="78" height="78" stroke-width="3"/>
    <path d="M838 91 H920 V171 H1000" stroke-width="3"/>

    <!-- the seam: the connector crosses it, and changes hand -->
    <path d="M1000 26 V234" stroke-width="1" stroke-dasharray="8 8" opacity="0.32"/>

    <!-- freehand, past the seam: the same connector and the same node, drawn
         in two passes the way roughness 1 lays them down -->
    <g stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M999 171.2 q28 -1.1 55 0.4 q14 0.4 28 -0.4"/>
      <path d="M999.4 172.1 q27.6 0.9 54.6 -0.5 q14.4 -0.8 28.2 0.3"/>
      <path d="M1068.2 164.3 L1081.8 171 L1068.4 177.8"/>
      <path d="M1069 165.4 L1082.4 171.2 L1069.2 176.9"/>

      <path d="M1082.8 132.2 q19 -1.2 38.4 0.4 q19.6 1.6 38.2 -0.9"/>
      <path d="M1159.6 132.4 q1.3 19.4 -0.5 38.6 q-1.7 19.2 0.7 38.2"/>
      <path d="M1159.8 209.6 q-19.4 1.3 -38.6 -0.5 q-19.2 -1.7 -38.2 0.7"/>
      <path d="M1082.4 209.8 q-1.3 -19.4 0.5 -38.6 q1.7 -19.2 -0.7 -38.2"/>

      <path d="M1082.2 131.3 q19.4 1.1 38.6 -0.6 q19.2 -1.7 38.2 1.1"/>
      <path d="M1160.7 132.9 q-1.1 19.2 0.6 38.4 q1.7 19.4 -1.1 38.2"/>
      <path d="M1159.3 210.7 q-19.2 -1.1 -38.4 0.6 q-19.4 1.7 -38.2 -1.1"/>
      <path d="M1081.3 209.3 q1.1 -19.2 -0.6 -38.4 q-1.7 -19.4 1.1 -38.2"/>
    </g>
  </g>
</svg>
