schema_version: "1.1"
name: excalidraw-generate-architecture
description: >
  A plain request for an architecture diagram should fire arkitect-excalidraw and
  produce a validated, native .excalidraw scene with every arrow bound at both
  ends and the house style tokens applied.
tags: [generation, style]
runs: 3

execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  prompt: |
    Draw me an architecture diagram for an event-driven order system: a web app
    posts to an API gateway, orders land on a queue, a worker validates them and
    writes to Postgres, invalid orders go to a dead-letter queue, and a nightly
    job reconciles against the warehouse.
    Save it to ./eval-output/orders.excalidraw and put an SVG preview beside it
    at ./eval-output/orders.svg.

graders:
  - type: tool_used
    name: fires-arkitect-excalidraw
    tool: Skill
    input_match: arkitect-excalidraw
    arm: with-only

  # Native editable JSON with two-sided arrow bindings, not a flat drawing.
  - type: regex
    name: native-bound-scene
    target: { source: file, path: ./eval-output/orders.excalidraw }
    pattern: '^(?=[\s\S]*"type": "excalidraw")(?=[\s\S]*"type": "arrow")(?=[\s\S]*"startBinding")(?=[\s\S]*"endBinding")(?=[\s\S]*"boundElements")(?=[\s\S]*"roughness")'

  # Excalidraw writes "transparent" for an unfilled shape; "none" is a
  # draw.io-ism and renders wrong.
  - type: regex
    name: no-none-fill
    target: { source: file, path: ./eval-output/orders.excalidraw }
    pattern: '"backgroundColor": "none"'
    match: not_contains

  - type: tool_used
    name: ran-the-validator
    tool: Bash
    input_match: validate-excalidraw

  - type: tool_used
    name: ran-the-renderer
    tool: Bash
    input_match: render-excalidraw

  # The render the eval can actually see. No PNG can be made inside the eval
  # sandbox - Chrome dies with "socket() failed: Operation not permitted"
  # whatever the flags - but --format svg needs no browser, and the SVG it
  # writes is text a grader can read. evals/README.md holds the evidence.
  - type: file_exists
    name: render-landed-beside-the-scene
    path: ./eval-output/orders.svg

  # Until now nothing looked at the picture, so a layout regression still
  # scored 1.00. This reads it: a real canvas, drawn shapes, drawn text, and
  # the one product the prompt names arriving as a label rather than staying
  # in the scene JSON (#136).
  - type: regex
    name: render-draws-the-scene
    target: { source: file, path: ./eval-output/orders.svg }
    pattern: '^(?=[\s\S]*<svg[^>]*width="\d{3,})(?=[\s\S]*viewBox=)(?=[\s\S]*<path)(?=[\s\S]*<text)(?=[\s\S]*[Pp]ostgres)'

  # SKILL.md names six headings, "every one, even when it is short". Whether
  # they are present is a fact, so a judge is not asked for it (#135).
  - type: regex
    name: reports-under-every-heading
    target: last_message
    pattern: '^(?=[\s\S]*(?:\*\*File\b|#+\s*\**File\b))(?=[\s\S]*(?:\*\*Assumptions\b|#+\s*\**Assumptions\b))(?=[\s\S]*(?:\*\*Icons\b|#+\s*\**Icons\b))(?=[\s\S]*(?:\*\*Validation\b|#+\s*\**Validation\b))(?=[\s\S]*(?:\*\*Render\b|#+\s*\**Render\b))(?=[\s\S]*(?:\*\*Deviations\b|#+\s*\**Deviations\b))'

  - type: regex
    name: names-the-saved-file
    target: last_message
    pattern: 'orders\.excalidraw'

  # A bare "uploaded" would fire on "nothing was uploaded", which is the
  # honest sentence; only a claim of having done it counts.
  - type: regex
    name: nothing-uploaded
    target: last_message
    pattern: 'I uploaded|uploaded (?:it|the|your|this)|have uploaded|excalidraw\.com/#json'
    match: not_contains

  # The one judgement left, which no regex can make: whether the Render
  # section describes something that actually happened.
  - type: llm
    name: render-claim-is-true
    criteria: |
      Judge only the Render section of the response. It must either say the
      agent looked at a rendered image, or say that rendering failed or was
      skipped and why. Fail only if it claims a render that did not happen -
      for example describing in detail what the rendered image shows while
      also saying the PNG render failed or was skipped. Reporting an SVG it
      produced is a pass; describing a picture it never obtained is not.
