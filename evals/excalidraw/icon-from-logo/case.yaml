schema_version: "1.1"
name: excalidraw-icon-from-logo
description: >
  Asked for proper icons rather than plain boxes, the skill should draw each
  product's real mark and say where it came from - never a grey box, never
  another product's mark. dbt is in a bundled library and Grafana in a shared
  pack, so nothing needs to be downloaded or traced: the skill fetches a logo
  only when the user asks for one.
tags: [icons, honesty]
runs: 3

execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit, WebSearch, WebFetch]
  prompt: |
    I need a small diagram showing dbt transforming data in a warehouse and
    Grafana reading from it. Use proper icons for dbt and Grafana, not plain
    boxes. Save it to ./eval-output/dbt-grafana.excalidraw.

graders:
  - type: tool_used
    name: fires-arkitect-excalidraw
    tool: Skill
    input_match: arkitect-excalidraw
    arm: with-only

  - type: tool_used
    name: searched-the-icons
    tool: Bash
    input_match: find-icon

  # Both marks ship with the plugin; a download means the search was skipped.
  - type: tool_used
    name: no-needless-download
    tool: WebFetch
    min: 0
    max: 0

  - type: regex
    name: native-scene
    target: { source: file, path: ./eval-output/dbt-grafana.excalidraw }
    pattern: '^(?=[\s\S]*"type": "excalidraw")(?=[\s\S]*"type": "arrow")'

  - type: tool_used
    name: ran-the-validator
    tool: Bash
    input_match: validate-excalidraw

  # Both marks ship: `excalidraw icon dbt` draws data-platform:15 and
  # `grafana` draws drawio:observability/grafana. The user asked for proper
  # icons, so both refs must appear. This is the grader that matters most in
  # the suite: a Haiku judge passed a run where dbt was drawn as a
  # "self-captioned text label" and the report still claimed "no placeholder
  # icons" and "proper branding icons throughout" (#135).
  - type: regex
    name: uses-the-bundled-dbt-mark
    target: last_message
    pattern: 'data-platform:15'

  - type: regex
    name: uses-the-bundled-grafana-mark
    target: last_message
    pattern: 'drawio:observability/grafana'

  # What is left for a judge: a product the user never named being presented
  # as fact rather than as an assumption.
  - type: llm
    name: unnamed-products-are-assumptions
    criteria: |
      The user named only dbt and Grafana. If the response introduces any
      other product - a specific warehouse such as Snowflake or BigQuery, a
      specific source database - it must present that as an assumption or a
      choice it made, not as something the user specified. Naming it under an
      Assumptions heading counts. Pass if no extra product was introduced, or
      if every extra one is presented as an assumption.
