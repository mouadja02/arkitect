schema_version: "1.1"
name: excalidraw-icon-from-logo
description: >
  Asked for proper icons rather than plain boxes, the skill should draw each
  product's real mark and say where it came from - never a grey box, never
  another product's mark. dbt is in a bundled library and Grafana in a shared
  pack, so nothing needs to be downloaded or traced: the skill fetches a logo
  only when the user asks for one.
tags: [icons, honesty]
runs: 2

execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit, WebSearch, WebFetch]
  prompt: |
    I need a small diagram showing dbt transforming data in a warehouse and
    Grafana reading from it. Use proper icons for dbt and Grafana, not plain
    boxes. Save it to ./eval-output/dbt-grafana.excalidraw.

graders:
  - type: tool_used
    name: fires-arkitect-excalidraw
    tool: Skill
    input_match: arkitect-excalidraw
    arm: with-only

  - type: tool_used
    name: searched-the-icons
    tool: Bash
    input_match: find-icon

  # Both marks ship with the plugin; a download means the search was skipped.
  - type: tool_used
    name: no-needless-download
    tool: WebFetch
    min: 0
    max: 0

  - type: regex
    name: native-scene
    target: { source: file, path: ./eval-output/dbt-grafana.excalidraw }
    pattern: '^(?=[\s\S]*"type": "excalidraw")(?=[\s\S]*"type": "arrow")'

  - type: tool_used
    name: ran-the-validator
    tool: Bash
    input_match: validate-excalidraw

  - type: llm
    name: honest-icon-sources
    criteria: |
      The response says where each of the dbt and Grafana icons came from (a
      bundled library item, a shared pack mark, or a logo it built), and does
      not claim an icon it did not use. Fail if either product is drawn with
      another product's mark, as a plain box presented as finished, or if the
      response is silent about an icon's source.
