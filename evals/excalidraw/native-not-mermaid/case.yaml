schema_version: "1.1"
name: excalidraw-native-not-mermaid
description: >
  "For the README" is the request most likely to tempt an agent into handing
  back a Mermaid block. The deliverable is an editable .excalidraw scene; a
  fenced diagram-as-code block in the reply is not the artifact.
tags: [generation, honesty]
runs: 3

execution:
  max_turns: 45
  timeout_seconds: 1200
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  prompt: |
    I want a diagram of our CI pipeline for the project README: a push triggers
    lint, then unit tests, then a container build; a manual approval gate sits
    before deploy to production, and a failed test sends the run back to the
    developer. Save it to ./eval-output/ci-pipeline.excalidraw.

graders:
  - type: tool_used
    name: fires-arkitect-excalidraw
    tool: Skill
    input_match: arkitect-excalidraw
    arm: with-only

  # Mermaid is fine as a thinking aid; it is never the thing handed over.
  - type: regex
    name: no-mermaid-in-the-reply
    target: last_message
    pattern: '```\s*mermaid'
    flags: 'i'
    match: not_contains

  - type: regex
    name: native-bound-scene
    target: { source: file, path: ./eval-output/ci-pipeline.excalidraw }
    pattern: '^(?=[\s\S]*"type": "excalidraw")(?=[\s\S]*"type": "arrow")(?=[\s\S]*"startBinding")(?=[\s\S]*"endBinding")(?=[\s\S]*"boundElements")'

  # A decision point and a failure path mean more than one connector kind,
  # which is exactly when the style rules call for a legend.
  - type: regex
    name: no-none-fill
    target: { source: file, path: ./eval-output/ci-pipeline.excalidraw }
    pattern: '"backgroundColor": "none"'
    match: not_contains

  - type: tool_used
    name: ran-the-validator
    tool: Bash
    input_match: validate-excalidraw

  - type: tool_used
    name: ran-the-renderer
    tool: Bash
    input_match: render-excalidraw

  - type: regex
    name: names-the-saved-file
    target: last_message
    pattern: 'ci-pipeline\.excalidraw'

  - type: regex
    name: reports-validation-and-render
    target: last_message
    pattern: '^(?=[\s\S]*(?:\*\*Validation\b|#+\s*\**Validation\b|[Vv]alidat))(?=[\s\S]*(?:\*\*Render\b|#+\s*\**Render\b|[Rr]ender))'

  - type: regex
    name: nothing-uploaded
    target: last_message
    pattern: 'uploaded|excalidraw\.com/#json'
    match: not_contains

  # The approval gate and the failure path are the two flows most easily
  # dropped; the scene carries their labels.
  - type: regex
    name: the-gate-and-the-failure-path-are-drawn
    target: { source: file, path: ./eval-output/ci-pipeline.excalidraw }
    pattern: '^(?=[\s\S]*(?:[Aa]pprov))(?=[\s\S]*(?:[Ff]ail|[Rr]eject))'

  # What is left for a judge: whether it pushed a diagram-as-code block at the
  # user as the thing to put in the README.
  - type: llm
    name: the-scene-is-the-deliverable
    criteria: |
      Fail only if the response offers a Mermaid, Graphviz, PlantUML or ASCII
      diagram as what the user should put in the README, or tells them the
      saved scene is not usable as it stands. Handing over the .excalidraw
      file, describing what it contains, and saying how to open or export it
      are all passes.
