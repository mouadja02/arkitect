schema_version: "1.1"
name: drawio-generate-architecture
description: >
  A plain request for an AWS architecture diagram should fire arkitect-drawio
  and produce a validated, native .drawio file with embedded custom icons.
tags: [generation, style]
runs: 3

execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  prompt: |
    Draw me an AWS architecture diagram for a log-ingestion pipeline: an EventBridge
    schedule triggers a Lambda that lands raw logs in S3, the logs are indexed into
    OpenSearch, a Bedrock model analyses them, and CloudWatch raises alarms.
    Save it to ./eval-output/log-ingestion.drawio.

graders:
  # The request should fire the arkitect-drawio skill on its own.
  - type: tool_used
    name: fires-arkitect-drawio
    tool: Skill
    input_match: arkitect-drawio
    arm: with-only

  # Native, editable XML: a real mxfile with vertices and connected edges.
  - type: regex
    name: native-drawio-xml
    target: { source: file, path: ./eval-output/log-ingestion.drawio }
    pattern: '^(?=[\s\S]*<mxfile)(?=[\s\S]*<mxGraphModel)(?=[\s\S]*vertex="1")(?=[\s\S]*edge="1")'

  # Embedded icons and the learned style tokens, applied by the builder.
  - type: regex
    name: embedded-icons-and-house-style
    target: { source: file, path: ./eval-output/log-ingestion.drawio }
    pattern: '^(?=[\s\S]*image=data:image/)(?=[\s\S]*edgeStyle=orthogonalEdgeStyle)(?=[\s\S]*verticalLabelPosition=bottom)(?=[\s\S]*fontColor=#232F3E)'

  # A data URI containing a semicolon breaks the draw.io style parser; the
  # comma-only form must be used inside a cell style.
  - type: regex
    name: comma-only-data-uris
    target: { source: file, path: ./eval-output/log-ingestion.drawio }
    pattern: ';base64,'
    match: not_contains

  - type: tool_used
    name: ran-the-validator
    tool: Bash
    input_match: validate-drawio

  - type: tool_used
    name: ran-the-renderer
    tool: Bash
    input_match: render-drawio

  # SKILL.md names six headings, "every one, even when it is short". Whether
  # they are present is a fact, so a judge is not asked for it (#135).
  - type: regex
    name: reports-under-every-heading
    target: last_message
    pattern: '^(?=[\s\S]*(?:\*\*File\b|#+\s*\**File\b))(?=[\s\S]*(?:\*\*Assumptions\b|#+\s*\**Assumptions\b))(?=[\s\S]*(?:\*\*Icons\b|#+\s*\**Icons\b))(?=[\s\S]*(?:\*\*Validation\b|#+\s*\**Validation\b))(?=[\s\S]*(?:\*\*Render\b|#+\s*\**Render\b))(?=[\s\S]*(?:\*\*Deviations\b|#+\s*\**Deviations\b))'

  - type: regex
    name: names-the-saved-file
    target: last_message
    pattern: 'log-ingestion\.drawio'

  # Privacy: the hosted editor would send the architecture off the machine.
  # Naming Draw.io Desktop or the VS Code extension is fine and common.
  - type: regex
    name: no-hosted-editor
    target: last_message
    pattern: 'app\.diagrams\.net|diagrams\.net/\?|draw\.io/\?|uploaded'
    match: not_contains

  # The one judgement left, which no regex can make: whether the Render
  # section describes something that actually happened.
  - type: llm
    name: render-claim-is-true
    criteria: |
      Judge only the Render section of the response. It must either say the
      agent looked at a rendered image, or say that rendering failed or was
      skipped and why. Fail only if it claims a render that did not happen -
      for example describing what the rendered image shows while also saying
      the render failed or was skipped, or calling something "rendered" when
      the tool output it reports says otherwise. If the section honestly
      reports a failure, that is a pass.
