schema_version: "1.1"
name: drawio-generate-architecture
description: >
  A plain request for an AWS architecture diagram should fire arkitect-drawio
  and produce a validated, native .drawio file with embedded custom icons.
tags: [generation, style]
runs: 3

execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  prompt: |
    Draw me an AWS architecture diagram for a log-ingestion pipeline: an EventBridge
    schedule triggers a Lambda that lands raw logs in S3, the logs are indexed into
    OpenSearch, a Bedrock model analyses them, and CloudWatch raises alarms.
    Save it to ./eval-output/log-ingestion.drawio.

graders:
  # The request should fire the arkitect-drawio skill on its own.
  - type: tool_used
    name: fires-arkitect-drawio
    tool: Skill
    input_match: arkitect-drawio
    arm: with-only

  - type: file_exists
    name: diagram-written
    path: ./eval-output/log-ingestion.drawio

  # Native, editable XML: a real mxfile with vertices and connected edges.
  - type: regex
    name: native-drawio-xml
    target: { source: file, path: ./eval-output/log-ingestion.drawio }
    pattern: '^(?=[\s\S]*<mxfile)(?=[\s\S]*<mxGraphModel)(?=[\s\S]*vertex="1")(?=[\s\S]*edge="1")'

  # Embedded icons and the learned style tokens, applied by the builder.
  - type: regex
    name: embedded-icons-and-house-style
    target: { source: file, path: ./eval-output/log-ingestion.drawio }
    pattern: '^(?=[\s\S]*image=data:image/)(?=[\s\S]*edgeStyle=orthogonalEdgeStyle)(?=[\s\S]*verticalLabelPosition=bottom)(?=[\s\S]*fontColor=#232F3E)'

  # A data URI containing a semicolon breaks the draw.io style parser; the
  # comma-only form must be used inside a cell style.
  - type: regex
    name: comma-only-data-uris
    target: { source: file, path: ./eval-output/log-ingestion.drawio }
    pattern: ';base64,'
    match: not_contains

  - type: tool_used
    name: ran-the-validator
    tool: Bash
    input_match: validate-drawio

  - type: llm
    name: honest-report
    criteria: |
      The response reports the saved file path, states the architectural
      assumptions it made, and says that it validated and rendered the diagram.
      It must not claim to have opened the hosted draw.io editor or to have
      uploaded anything. Pass only if all of that holds.
