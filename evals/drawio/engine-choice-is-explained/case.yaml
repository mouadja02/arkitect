schema_version: "1.1"
name: drawio-engine-choice-is-explained
description: >
  The user names no engine. An AWS architecture going in front of a client's
  review board is the Draw.io case, and whichever way the choice goes the agent
  has to say which engine it picked and why rather than choosing in silence.
tags: [generation, invocation]
runs: 3

execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Write, Edit]
  prompt: |
    We are presenting our AWS landing zone to the client's architecture review
    board next week: an Organizations management account, a shared-services
    account with Transit Gateway and Route 53 resolver endpoints, a security
    account collecting CloudTrail into S3 and GuardDuty findings, and two
    workload accounts. Draw it and save it as ./eval-output/landing-zone with
    whichever file extension is right for what you draw.

graders:
  # "Solution architecture", "for the client", "AWS" all point at Draw.io.
  - type: tool_used
    name: fires-arkitect-drawio
    tool: Skill
    input_match: arkitect-drawio
    arm: with-only

  - type: tool_used
    name: excalidraw-not-used-instead
    tool: Skill
    input_match: arkitect-excalidraw
    min: 0
    max: 0

  - type: regex
    name: wrote-a-drawio-file
    target: files
    pattern: 'landing-zone\.drawio'

  - type: tool_used
    name: ran-the-validator
    tool: Bash
    input_match: validate-drawio

  # The report shape had no slot for the choice, so it was never written while
  # the choice itself was right every time (#180). The heading is mechanical;
  # whether the reason is a reason stays with the judge below.
  - type: regex
    name: report-has-an-engine-slot
    target: last_message
    pattern: '(?:\*\*Engine|#+ *Engine|^Engine\b)'
    flags: m

  # The same for the other heading this case used to police through the judge:
  # whether an Assumptions section exists is a fact about the text.
  - type: regex
    name: report-has-an-assumptions-slot
    target: last_message
    pattern: '(?:\*\*Assumptions|#+ *Assumptions|^Assumptions\b)'
    flags: m

  # One grader, one claim. This one asked for three - name the format, give a
  # reason over the alternative, state the assumptions - so a red said nothing
  # about which had failed, and a run with a good engine sentence failed a
  # grader called says-which-engine-and-why for writing no Assumptions heading.
  # The judge also split 3-0 in both directions on materially the same sentence,
  # so what counts as a reason is now named: a property that tells the two
  # engines apart, not a virtue they share (#180).
  - type: llm
    name: says-which-engine-and-why
    criteria: |
      Judge only what the response says about the engine or format it chose.
      It names what it produced (a .drawio / draw.io file) and gives a reason
      that separates Draw.io from Excalidraw: a formal, client-facing or
      review-board audience, AWS or vendor icons, several pages, or similar.
      Naming Excalidraw itself is not required. Fail only if the choice is
      never explained, if every reason it gives would fit either engine
      equally well - "editable", "professional", "clear", "collaborative" -
      or if the response claims to have uploaded the diagram anywhere.

  - type: llm
    name: states-its-assumptions
    criteria: |
      The request leaves several things open: the region, how the accounts
      connect, what the workload accounts run. Anything the response settled
      for itself is presented as its own assumption or choice, not as
      something the user specified. Pass if it states the assumptions it made,
      wherever they appear in the reply. Fail only if it decided something the
      prompt left open and passed it off as given, or if it states no
      assumptions at all.

  # Whether the accounts are drawn as boundaries is a fact about the file, not
  # something to infer from the prose - the prose version of this grader
  # flapped pass/fail/fail on unchanged code (#135). Every boundary kind the
  # builder emits - awsGroup, scope and lane - carries container=1, and the
  # prompt names five accounts, so four containers is a safe floor for "not
  # one flat row of boxes".
  - type: regex
    name: accounts-are-boundaries
    target: { source: file, path: ./eval-output/landing-zone.drawio }
    pattern: '^(?=(?:[\s\S]*?container=1){4})'

  # The prompt says two workload accounts. A third was once added "for better
  # visual balance" and disclosed as an assumption, which is not what an
  # assumption is (#183). One-directional on purpose: it fails only when a third
  # workload boundary is actually drawn, and says nothing when the agent names
  # the accounts something else, so a correct diagram can never turn it red.
  - type: regex
    name: no-account-the-prompt-did-not-name
    target: { source: file, path: ./eval-output/landing-zone.drawio }
    pattern: '(?:[\s\S]*?value="[^"]*[Ww]orkload[^"]*"[^>]*container=1){3}'
    match: not_contains

  # The rule is about where a reply points the user, not only about what the
  # agent opens: a closing sentence offering the hosted editor is the same act
  # (#186). Mechanical, because a judge read one as an ordinary recommendation.
  - type: regex
    name: no-hosted-editor
    target: last_message
    pattern: 'app\.diagrams\.net|viewer\.diagrams\.net|diagrams\.net/\?|//(?:www\.)?draw\.io'
    match: not_contains
